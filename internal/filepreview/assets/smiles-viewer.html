<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SMILES 2D Molecule Viewer</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --border: rgba(15, 23, 42, 0.12);
  --fg: #111827;
  --muted: #64748b;
  --accent: #4f46e5;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: 12px;
}
html[data-theme="dark"] {
  --bg: #14161a;
  --surface: #1b1e24;
  --surface-2: #242830;
  --border: rgba(255, 255, 255, 0.11);
  --fg: #e5e7eb;
  --muted: #94a3b8;
  --accent: #818cf8;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
}
body { display: flex; flex-direction: column; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
input, button {
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  height: 24px;
  padding: 0 8px;
  outline: none;
}
input.search { width: 220px; }
input:focus { border-color: var(--accent); }
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: 0.45; cursor: default; }
.stats {
  margin-left: auto;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
}
.grid {
  flex: 1;
  overflow: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 10px;
  align-content: start;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.mol-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mol-formula {
  font-size: 10.5px;
  color: var(--muted);
  font-family: ui-monospace, Menlo, monospace;
  flex-shrink: 0;
}
.svg-box {
  height: 158px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.smi-line {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.smi-line:hover { color: var(--accent); }
.pager {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 6px 12px;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
}
.pager.visible { display: flex; }
.toast {
  position: fixed;
  right: 14px;
  bottom: 14px;
  padding: 5px 10px;
  border-radius: 6px;
  background: var(--fg);
  color: var(--bg);
  font-size: 11px;
  opacity: 0;
  transition: opacity 0.16s ease;
  pointer-events: none;
}
.toast.show { opacity: 0.92; }
</style>
</head>
<body>
<header class="toolbar">
  <input id="search" class="search" placeholder="Search name or SMILES...">
  <span id="stats" class="stats">Loading...</span>
</header>
<main id="grid" class="grid"></main>
<footer id="pager" class="pager">
  <button id="prev">&lsaquo; Prev</button>
  <span id="page-info">1 / 1</span>
  <button id="next">Next &rsaquo;</button>
</footer>
<div id="toast" class="toast"></div>
<script src="./vendor/smiles-drawer/smiles-drawer.min.js"></script>
<script>
const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const statsEl = document.getElementById('stats');
const pagerEl = document.getElementById('pager');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const pageInfo = document.getElementById('page-info');
const toastEl = document.getElementById('toast');

let meta = { name: 'ligands.smi', dark: false };
let molecules = [];
let filtered = [];
let page = 0;
const PAGE_SIZE = 48;

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

function applyTheme(dark) {
  meta.dark = Boolean(dark);
  document.documentElement.dataset.theme = meta.dark ? 'dark' : 'light';
  renderPage();
}

function parseSmilesFile(text) {
  const out = [];
  let idx = 0;
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith('#')) continue;
    const parts = line.split(/[\t, ]+/);
    const smi = parts[0];
    if (idx === 0 && /^(smiles|smi|canonical_smiles)$/i.test(smi)) { idx++; continue; }
    const name = parts.slice(1).join(' ') || `Mol_${out.length + 1}`;
    out.push({ smiles: smi, name });
    idx++;
  }
  return out;
}

async function copySmiles(smi) {
  try {
    await navigator.clipboard.writeText(smi);
    showToast('Copied SMILES');
  } catch {
    if (window.viva?.postMessage) {
      window.viva.postMessage(JSON.stringify({ type: 'copy', text: smi }));
      showToast('Copied SMILES');
    }
  }
}

function renderPage() {
  grid.replaceChildren();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  page = Math.min(page, totalPages - 1);
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const theme = meta.dark ? 'dark' : 'light';
  const drawer = new window.SmiDrawer({ width: 206, height: 152, bondThickness: 1.35, padding: 12 });

  for (const mol of slice) {
    const card = document.createElement('article');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'card-head';
    const nameEl = document.createElement('span');
    nameEl.className = 'mol-name';
    nameEl.textContent = mol.name;
    nameEl.title = mol.name;
    const formulaEl = document.createElement('span');
    formulaEl.className = 'mol-formula';
    head.append(nameEl, formulaEl);

    const svgBox = document.createElement('div');
    svgBox.className = 'svg-box';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '206');
    svg.setAttribute('height', '152');
    svgBox.appendChild(svg);

    const smiLine = document.createElement('div');
    smiLine.className = 'smi-line';
    smiLine.textContent = mol.smiles;
    smiLine.title = `Click to copy: ${mol.smiles}`;
    smiLine.onclick = () => copySmiles(mol.smiles);

    card.append(head, svgBox, smiLine);
    grid.appendChild(card);

    try {
      drawer.draw(mol.smiles, svg, theme, () => {
        if (!mol.smiles.includes('>') && typeof drawer.drawer?.getMolecularFormula === 'function') {
          try {
            formulaEl.textContent = drawer.drawer.getMolecularFormula() || '';
          } catch {}
        }
      }, () => {
        svgBox.innerHTML = '<span style="color:var(--muted);font-size:11px">Could not parse SMILES</span>';
      });
    } catch {
      // SmiDrawer callback handles parse errors cleanly.
    }
  }

  pagerEl.classList.toggle('visible', totalPages > 1);
  pageInfo.textContent = `${page + 1} / ${totalPages}`;
  prevBtn.disabled = page <= 0;
  nextBtn.disabled = page >= totalPages - 1;
  statsEl.textContent = `${filtered.length.toLocaleString()} / ${molecules.length.toLocaleString()} molecules`;
}

function applyFilter() {
  const q = searchEl.value.trim().toLowerCase();
  filtered = !q ? molecules : molecules.filter(m => m.name.toLowerCase().includes(q) || m.smiles.toLowerCase().includes(q));
  page = 0;
  renderPage();
}

searchEl.oninput = applyFilter;
prevBtn.onclick = () => { if (page > 0) { page--; renderPage(); grid.scrollTop = 0; } };
nextBtn.onclick = () => { page++; renderPage(); grid.scrollTop = 0; };

if (window.viva) {
  window.viva.onmessage = (raw) => {
    try {
      const msg = JSON.parse(raw);
      if (msg.type === 'theme') applyTheme(msg.dark);
    } catch {}
  };
}

async function boot() {
  try {
    const [metaRes, payloadRes] = await Promise.all([fetch('./meta.json'), fetch('./payload')]);
    if (!metaRes.ok || !payloadRes.ok) throw new Error('Could not load SMILES file');
    meta = { ...meta, ...(await metaRes.json()) };
    applyTheme(meta.dark);
    document.title = `${meta.name} — SMILES`;
    const text = await payloadRes.text();
    molecules = parseSmilesFile(text);
    applyFilter();
  } catch (err) {
    statsEl.textContent = String(err?.message || err);
  }
}
boot();
</script>
</body>
</html>
